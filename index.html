<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SkyBrief 天气简报 —— 实时天气、3 天预报、24 小时温度折线图与全国省份气温地图">
  <title>SkyBrief · 天气简报</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <span class="brand-name">SkyBrief</span>
      <span class="brand-sub">天气简报</span>
    </div>

    <div class="controls">
      <div class="search" id="search">
        <input id="cityInput" type="text" autocomplete="off" placeholder="搜索城市，如 北京 / 上海 / 深圳">
        <ul id="suggest" class="suggest" role="listbox"></ul>
      </div>
      <button id="geoBtn" class="btn" type="button" title="使用浏览器定位当前位置">📍 定位</button>
      <select id="providerSel" class="btn sel" title="切换天气数据源">
        <option value="open-meteo">数据源：Open-Meteo</option>
        <option value="cnweather">数据源：中国天气网</option>
        <option value="weatherdt">数据源：气象数据平台</option>
      </select>
      <button id="themeBtn" class="btn" type="button" title="切换深色 / 浅色主题">🌙</button>
    </div>
  </header>

  <main class="layout">
    <!-- 左栏：城市天气图框（已收窄） -->
    <div class="col-left">
      <section class="hero card" id="hero">
        <div class="hero-head">
          <div class="hero-loc" id="heroLoc">正在获取位置…</div>
          <div class="hero-badge" id="heroBadge">--</div>
        </div>
        <div class="hero-main">
          <div class="hero-icon" id="heroIcon">⛅</div>
          <div class="hero-temp">
            <span id="heroTemp">--</span><sup class="unit">°C</sup>
          </div>
        </div>
        <div class="hero-desc" id="heroDesc">加载中</div>
        <div class="hero-stats" id="heroStats"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>24 小时趋势</h2>
          <span class="card-hint" id="hourHint">温度 · 降水概率</span>
        </div>
        <canvas id="hourChart" class="chart" height="170"></canvas>
        <div class="hour-strip" id="hourStrip"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>未来 3 天</h2>
          <span class="card-hint">最高 / 最低气温</span>
        </div>
        <div class="daily" id="dailyList"></div>
      </section>
    </div>

    <!-- 右栏：中国地图 -->
    <section class="map-card card">
      <div class="card-head">
        <h2>全国省份气温</h2>
        <span class="card-hint" id="mapHint">悬停省份查看 24 小时趋势 · 点击切换城市</span>
      </div>
      <div class="map-wrap" id="mapWrap">
        <canvas id="chinaMap" class="china-map"></canvas>
        <div class="map-tooltip" id="mapTooltip" role="tooltip"></div>
        <div class="map-status" id="mapStatus">正在加载中国地图…</div>
      </div>
      <div class="map-legend" id="mapLegend"></div>
    </section>
  </main>

  <footer class="footer">
    <span id="metaProvider">数据源：--</span>
    <span class="dot">·</span>
    <span id="metaTime">更新时间：--</span>
    <span class="dot">·</span>
    <span id="mapMeta">地图数据源：Open-Meteo</span>
    <button id="reloadBtn" class="link-btn" type="button">刷新</button>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/weather.js"></script>
  <script src="js/app.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
